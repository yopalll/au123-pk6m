<!-- Micro-interaction Script -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const serviceCards = document.querySelectorAll('.service-card');
            const continueBtn = document.getElementById('continueBtn');
            let selectedService = null;

            serviceCards.forEach(card => {
                card.addEventListener('click', () => {
                    // Deselect previous
                    if (selectedService) {
                        selectedService.classList.remove('selected', 'border-primary');
                        selectedService.classList.add('border-border-glow');
                        const prevIndicator = selectedService.querySelector('.check-indicator');
                        prevIndicator.classList.remove('bg-primary', 'border-primary');
                        prevIndicator.querySelector('span').classList.remove('opacity-100');
                    }

                    // Select new
                    selectedService = card;
                    card.classList.add('selected', 'border-primary');
                    card.classList.remove('border-border-glow');
                    
                    const indicator = card.querySelector('.check-indicator');
                    indicator.classList.add('bg-primary', 'border-primary');
                    indicator.querySelector('span').classList.add('opacity-100');

                    // Enable Continue Button
                    continueBtn.disabled = false;
                    continueBtn.classList.remove('bg-surface-container-highest', 'text-on-surface-variant', 'opacity-50', 'cursor-not-allowed');
                    continueBtn.classList.add('bg-primary', 'text-surface-dim', 'opacity-100', 'cursor-pointer', 'hover:bg-primary-fixed', 'shadow-[0_0_20px_rgba(255,182,139,0.3)]');
                });
            });
        });
    </script>
