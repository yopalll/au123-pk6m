<script>
        // Custom toggle logic for the visibility switch to ensure UI updates smoothly
        const toggle = document.getElementById('visibility-toggle');
        const dot = toggle.nextElementSibling.nextElementSibling;
        const bg = toggle.nextElementSibling;
        
        toggle.addEventListener('change', (e) => {
            if(e.target.checked) {
                dot.classList.add('translate-x-4', 'bg-surface');
                dot.classList.remove('bg-primary');
                bg.classList.add('bg-primary-container');
                bg.classList.remove('bg-surface-charcoal');
            } else {
                dot.classList.remove('translate-x-4', 'bg-surface');
                dot.classList.add('bg-primary');
                bg.classList.remove('bg-primary-container');
                bg.classList.add('bg-surface-charcoal');
            }
        });
    </script>
