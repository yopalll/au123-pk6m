    background-size: cover;
    background-attachment: fixed;
    background-position: center
    }
.glass-panel {
    background-color: rgba(26, 29, 33, 0.7);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(255, 255, 255, 0.15);
    box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1)
    }
.input-focus-glow:focus-within {
    border-color: #FFB68B;
    box-shadow: 0 0 0 2px rgba(255, 182, 139, 0.2)
    }
/* Custom Checkbox */
.service-checkbox {
    appearance: none;
    width: 20px;
    height: 20px;
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 4px;
    background-color: transparent;
    cursor: pointer;
    position: relative;
    transition: all 0.2s ease
    }
.service-checkbox:checked {
    background-color: #FFB68B;
    border-color: #FFB68B
    }
.service-checkbox:checked::after {
    content: "";
    position: absolute;
    left: 6px;
    top: 2px;
    width: 6px;
    height: 12px;
    border: solid #111316;
    border-width: 0 2px 2px 0;
    transform: rotate(45deg)
    }
/* Avatar Selection */
.avatar-radio {
    display: none
    }
.avatar-label {
    cursor: pointer;
    transition: all 0.3s ease
    }
.avatar-radio:checked + .avatar-label {
    border-color: #FFB68B;
    box-shadow: 0 0 0 2px rgba(255, 182, 139, 0.2);
    transform: scale(1.05)
    }
.avatar-radio:checked + .avatar-label .avatar-name {
    color: #FFB68B
    }</style>
