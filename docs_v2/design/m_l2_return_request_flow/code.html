<!-- Lightweight interaction script -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const checkboxes = document.querySelectorAll('.point-checkbox');
            const pointsDisplay = document.getElementById('total-points');
            const countDisplay = document.getElementById('item-count');

            function calculateTotals() {
                let total = 0;
                let count = 0;
                checkboxes.forEach(cb => {
                    if (cb.checked) {
                        total += parseInt(cb.value);
                        count++;
                    }
                });
                pointsDisplay.textContent = total;
                countDisplay.textContent = count;
            }

            checkboxes.forEach(cb => {
                cb.addEventListener('change', calculateTotals);
            });
        });
    </script>
